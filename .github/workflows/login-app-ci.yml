name: Login App CI (Node.js + Jest)

on:
  push:
    paths:
      - 'code/login-app/**'
      - '.github/workflows/login-app-ci.yml'
  pull_request:
    branches: [dev, release]
    paths:
      - 'code/login-app/**'
      - '.github/workflows/login-app-ci.yml'

jobs:
  test:
    name: Build and test login app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/login-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: 'npm'
          cache-dependency-path: code/login-app/package-lock.json

      - name: Install npm 11.14.0
        run: npm install -g npm@11.14.0

      - name: Verify Node and npm versions match package.json
        run: |
          echo "node $(node -v), npm $(npm -v)"
          test "$(node -v)" = "v24.13.0"
          test "$(npm -v)" = "11.14.0"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
