# Builds the StudyHub project and runs mvn verify (tests, checkstyle, coverage).

name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches:
      - dev
      - release

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: |
        echo Testing Project
        cd "code/studyhub-app/"
        mvn --batch-mode --update-snapshots clean verify
        cd ../..
