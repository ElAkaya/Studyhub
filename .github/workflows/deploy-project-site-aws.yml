name: Deploy Project Site to AWS Elastic Beanstalk

on:
  push:
    branches: [dev]
    paths:
      - 'code/project-site/**'
      - '.github/workflows/deploy-project-site-aws.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Package and deploy project site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Package project site
        working-directory: code/project-site
        run: zip -r ../../deploy.zip . -x "node_modules/*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: studyhub-site
          environment_name: Studyhub-site-env
          region: us-east-2
          version_label: run-${{ github.run_number }}-${{ github.run_attempt }}
          deployment_package: deploy.zip
          wait_for_environment_recovery: 120
